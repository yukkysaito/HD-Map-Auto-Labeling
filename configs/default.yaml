# Default settings. A project config (any yaml, see configs/example.yaml) overrides any of these keys; data paths can
# also be given on the command line:  ./autolabel run --map <pointcloud_map.pcd> --logs "<log dir>/*" [--name NAME]
# Never point pointcloud_map at a lanelet2 / vector map: no HD map is used.

name: dataset                 # outputs go to <output>/<name>/{dataset,debug,work}
output: output                # relative paths are relative to the repository
pointcloud_map: null          # LiDAR point cloud map (.pcd) in the same map frame as the localization (required)
logs: []                      # globs; a directory = one drive (all its *.mcap), an .mcap file = one drive
drives: {}                    # explicit drives: name -> {bags: glob, tf_from: drive name or tf_static .json}
review_dir: null              # hand-made review fixes (docs/ANNOTATION.md); default review/<name>

# ---- rosbag topics ({id} = camera id). Defaults: Autoware.
topics:
  pose: /localization/kinematic_state                    # nav_msgs/Odometry: base_link pose in the map frame
  velocity: /vehicle/status/velocity_status              # autoware_vehicle_msgs/VelocityReport (optional: derived from poses)
  tf_static: /tf_static                                  # camera mounting (camera frames -> base_link)
  image: /sensing/camera/camera{id}/image_raw/compressed # sensor_msgs/CompressedImage
  camera_info: /sensing/camera/camera{id}/camera_info    # sensor_msgs/CameraInfo (intrinsics, distortion, frame)
base_frame: base_link

# ---- cameras used for labelling: <id>: {} = pinhole with the valid-pixel crop of the calibrated distortion model,
#      <id>: {hfov: H} = pinhole with H deg horizontal FoV (wide / fisheye lenses). Cameras missing in a bag are skipped.
#      Topics other than the `topics` templates: <id>: {image: /front/image/compressed, camera_info: /front/camera_info}
cameras:
  8: {hfov: 90}
  5: {}
  3: {}
  6: {hfov: 100}
  7: {hfov: 100}
  0: {}
  1: {}
  2: {}
  9: {hfov: 100}
  10: {hfov: 100}
reference_camera: 8           # sample times follow this camera (front)
image_scale: 0.5              # images are stored at this scale
jpeg_quality: 95
tf_static: null               # camera mounting for bags without /tf_static (else another drive's /tf_static is used):
                              #   .json {frame: 4x4 T_base_frame} (ingest's tf_static.json), .mcap (a bag with /tf_static), or
                              #   .yaml [{frame: cam_front, parent: base_link, translation: [x, y, z], rotation: [qx, qy, qz, qw]}, ...]

# ---- road marking conventions (defaults: Japan)
markings:
  arrow_templates: jp         # hdlabel/assets/arrow_templates_<set>.npz (or a path): arrow shapes for direction matching
  line_width: 0.5             # painted lines wider than this (m) are areas (marking_area), thinner ones lines
  stop_line: {min_width: 0.35, min_length: 3.0, max_cos: 0.35}  # a line across the lanes (|cos| to them < max_cos), paint
                                                                 # at least min_width wide (lane lines ~0.15 m)
  fragments: {min_confidence: 0.5, short_length: 2.2, short_min_views: 20}  # lane-line pieces dropped as noise: below
                              # min_confidence, or shorter than short_length (m) and seen by fewer than short_min_views
                              # camera views (set min_confidence 0, short_length 0 to keep all; docs/MAINTENANCE.md)
  curb_filter: {enabled: false, adjacent_m: 2.0, min_adjacent: 0.3, min_first_edge: 0.15, max_wavy_deg_per_m: 30.0,
                rules: null}  # null: every rule; or a list of not_road_adjacent, not_first_edge, loop, wavy, edge_of_view
                              # vectorize variant curb_adjacency (hdlabel/curbcheck.py): curb lines that are not road kerbs
                              # become kind curb_candidate (props.curb_check = rules), not curb: less than min_adjacent of
                              # the line within adjacent_m of the road flood-filled from the drives' trajectories through
                              # curb / unobserved cells only (planters behind a sidewalk / hedge, wall bases, sidewalk
                              # pieces), not hit by sideways rays from the trajectories (< min_first_edge), small loops,
                              # wavy lines (mean turning > max_wavy_deg_per_m), short pieces at the edge of the view
  marking_gate: {enabled: false, tol_m: 0.04, min_on_level: 0.7, step_m: 0.07, ref_m: 3.0, rules: null}
                              # vectorize variant marking_level (hdlabel/markingcheck.py): lane lines, stop lines, marking
                              # areas and arrows off the road level become kind marking_candidate (props.candidate_of,
                              # marking_check = rules: off_level, raised, cut_off; null: all). LiDAR ground height of the
                              # element's cells vs a plane fitted to the road within ref_m (driven road first): less than
                              # min_on_level within tol_m and median beyond tol_m, median beyond step_m, or a step > step_m
                              # on the way from the driven road. Cells without LiDAR / near crosswalks are not judged

# ---- processing
segmentation:
  model: facebook/mask2former-swin-large-mapillary-vistas-semantic  # a Hugging Face Mask2Former checkpoint (README: license!),
                                                                     # or color_stub (synthetic data)
  class_map: null             # null: Mapillary Vistas ids (hdlabel/common.py GROUPS). Another model: its class ids per group,
                              # {road: [..], marking: [..], crosswalk: [..], curb: [..], sidewalk: [..],
                              #  offroad: [..], vertical: [..]} (vertical = walls, fences, vegetation: never voted on the ground)
scenes:  {length_m: 300, context_m: 150, corridor_m: 40}  # scene = a drive inside one cell of a fixed length_m map grid; labels
                                                          # cover that route +- context_m (the BEV ahead / behind) + corridor_m;
                                                          # optional region: [xmin, ymin, xmax, ymax] (map) to label only there
calib:   {scenes: 3,          # image time offsets estimated on the N scenes with the most turning,
          time_offset: estimate}  # or a fixed offset in s for every camera (e.g. 0: hardware-synchronised cameras)
fusion:  {max_drives: 5,       # labels of a scene from at most N drives on its road level,
          max_days_apart: null, # recorded at most this many days apart from the scene's drive (null: any),
          max_shift_m: 0.5}     # whose markings line up with the scene's drive's (else: not fused; 0: no check)
projection: {mode: gather,     # gather: every visible surface cell looks its class up in the image (no holes / moire
             power: 4}          # at range); splat: every ground pixel votes for the cell its ray hits. power: distance
                                # weight exponent of gather (near views dominate where they exist)
dataset: {every_s: 0.5, val_every_s: null,  # val sample spacing (null = every_s; 0.1 = every model cycle for online_eval)
          history_s: 2.0, history_dt_s: 0.5,
          bev: {x: [-50, 150], y: [-80, 80], res: 0.2},  # default ego-frame crop (the loader may use any range / res)
          split: {tile_m: 250, val_every: 5}}           # val = every 5th map tile (by location)
debug: true                   # debug images + PCDs + audit (--no-debug or false for large runs)
audit: {sample: 5, seed: 0, max_risk: 0.3, max_spot_error: 0.1}  # acceptance: scenes over max_risk need review; `sample` random scenes to inspect
prune_frames: false           # true: after export delete frames neither the dataset nor labelling uses
jobs: {cpu: 4, gpu: 1}        # parallel scenes / drives; GPU steps at once
device: auto                  # torch device of the GPU steps: auto (cuda if available) / cuda / cuda:1 / cpu (slow; tests)

# ---- agents (hdlabel/agents): which model plays which role. Providers: claude_cli, codex_cli, openai, anthropic,
#      replay (hdlabel/agents/llm.py). Pick models by measurement: ./autolabel bench status | bench verifier --role R.
agents:
  plan: subscription          # subscription | api (or env HDLABEL_AGENT_PLAN); roles below override single roles
  plans:
    subscription:             # Claude Code (`claude`) and Codex CLI (`codex`) logged in with a plan; API keys are not passed to them
      default:    {provider: claude_cli, model: claude-sonnet-5-5}
      verifier:   {provider: claude_cli, model: claude-sonnet-5-5, timeout: 300}  # chosen on the benchmark (bench status)
      confirmer:  {provider: codex_cli, model: null, timeout: 300}  # other vendor; must agree before a deletion
      adjudicator: {provider: claude_cli, model: claude-sonnet-5-5}  # judge of the benchmark reference
      researcher: {provider: claude_cli, model: claude-opus-5-5, timeout: 1800}
      engineer:   {provider: claude_cli, model: claude-opus-5-5, timeout: 3600}
    api:                      # ANTHROPIC_API_KEY / OPENAI_API_KEY, paid per token (pip install -e .[agents])
      default:    {provider: anthropic, model: claude-sonnet-5-5}
      verifier:   {provider: anthropic, model: claude-sonnet-5-5, timeout: 300}
      confirmer:  {provider: openai, model: gpt-5, timeout: 300}
      adjudicator: {provider: anthropic, model: claude-sonnet-5-5}
      researcher: {provider: anthropic, model: claude-opus-5-5, timeout: 1800}
      engineer:   {provider: claude_cli, model: claude-opus-5-5, timeout: 3600}  # edits files: Claude Code, billed to the API key
  roles: {}                   # e.g. {verifier: {provider: anthropic, model: claude-opus-5-5}}
  budget_usd: 30              # per run; calls stop (verifier -> uncertain) when spent
  price_per_mtok:             # cost estimate for providers that report tokens only; check the current prices
    codex_cli: 2.0
    anthropic: {claude-sonnet-5-5: [2.0, 10.0], claude-opus-5-5: [4.0, 20.0]}   # USD per 1M input, output tokens
    openai: {gpt-5: [1.25, 10.0]}
verification: {enabled: true, role: verifier, confirm_role: confirmer, max_rounds: 3, max_unsure: 5, reject_spot_wrong: 5, min_curb_step: 0.35, jobs: 4}
evolve: {min_cases: 5, max_attempts: 2,   # ./autolabel evolve: problems with >= min_cases issues; give up after N failed attempts
         targets: {"curb:false_positive": curb.fp, "curb:offset": curb.lidar, "marking:false_positive": marking.fp,
                   "marking:missed": marking.recall}}  # benchmark metric each problem type must improve
